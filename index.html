<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seitenübersicht</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0d1117; color: #c9d1d9; }
    h1 { color: #58a6ff; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.5rem 0; }
    a { color: #58a6ff; text-decoration: none; font-size: 1.1rem; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Inhaltsverzeichnis</h1>
  <ul id="file-list">Lade Dateien...</ul>

  <script>
    // PASSE DIESE BEIDEN VARIABLEN AN:
    const USERNAME = 'HemenHeMaN';
    const REPO = 'misc';

    async function loadFiles() {
      const listElement = document.getElementById('file-list');
      try {
        const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
        if (!response.ok) throw new Error('Fehler beim Laden der Ordnerstruktur');
        
        const files = await response.json();
        listElement.innerHTML = '';

        // Filtert HTML-Dateien (ohne index.html) und APK-Dateien heraus
        const validFiles = files.filter(file => {
          const name = file.name.toLowerCase();
          const isHtml = name.endsWith('.html') && name !== 'index.html';
          const isApk = name.endsWith('.apk');
          return isHtml || isApk;
        });

        if (validFiles.length === 0) {
          listElement.innerHTML = '<li>Keine Webseiten oder APK-Dateien gefunden.</li>';
          return;
        }

        validFiles.forEach(file => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          
          a.href = file.name;
          a.textContent = file.name.replace(/\.(html|apk)$/i, '').replace(/[-_]/g, ' ');

          // Fügt bei APK-Dateien einen Hinweis hinzu
          if (file.name.toLowerCase().endsWith('.apk')) {
            a.textContent += ' (APK Download)';
          }
          
          li.appendChild(a);
          listElement.appendChild(li);
        });

      } catch (error) {
        listElement.innerHTML = `<li style="color: #f85149;">${error.message}</li>`;
      }
    }

    loadFiles();
  </script>

</body>
</html>
