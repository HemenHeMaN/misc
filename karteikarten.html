<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karteikarten</title>
<style>
:root{--bg:#f3efe7;--card:#fffdf8;--ink:#1f2430;--muted:#7b7f8a;--accent:#d9593d;--back:#243b55;--backink:#f5f1e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#232733;--ink:#eef0f5;--muted:#9aa0ae;--accent:#ff7a5c;--back:#e9e2d0;--backink:#1c2230}}
:root[data-theme="dark"]{--bg:#14161c;--card:#232733;--ink:#eef0f5;--muted:#9aa0ae;--accent:#ff7a5c;--back:#e9e2d0;--backink:#1c2230}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
header{height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
header h1{font-size:clamp(2rem,7vw,3.5rem);margin:0 0 12px}
header p{color:var(--muted);font-family:system-ui,sans-serif;margin:0}
.slot{height:100vh;position:relative}
.sticky{position:sticky;top:12vh;display:flex;justify-content:center;padding:0 20px;perspective:1200px}
.card{width:min(520px,100%);height:min(60vh,420px);position:relative;will-change:transform,opacity,filter;transform-origin:50% 0}
.flip{position:absolute;inset:0;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.open .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;padding:28px;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.front{background:var(--card)}
.backf{background:var(--back);color:var(--backink);transform:rotateY(180deg)}
.num{position:absolute;top:20px;left:26px;font:600 .8rem system-ui,sans-serif;letter-spacing:.12em;color:var(--accent)}
.hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font:.75rem system-ui,sans-serif;color:var(--muted);opacity:.8}
.q{font-size:clamp(1.3rem,5vw,1.9rem);line-height:1.3;text-align:center}
.a{font-size:clamp(1.1rem,4.2vw,1.5rem);line-height:1.4;text-align:center}
footer{height:40vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
</style>
</head>
<body>
<header><h1>Karteikarten</h1><p>Scrolle nach unten ↓ · Tippe auf eine Karte zum Umdrehen</p></header>
<main id="deck"></main>
<footer>Das war's – gut gemacht ✓</footer>
<script>
const cards=[
["Hauptstadt von Australien?","Canberra – nicht Sydney oder Melbourne."],
["Was bedeutet „Carpe diem“?","„Nutze den Tag“ – lateinisch."],
["Wie viele Knochen hat ein erwachsener Mensch?","206"],
["Was ist die Lichtgeschwindigkeit im Vakuum?","Ca. 299.792 km/s"],
["Wer schrieb „Faust“?","Johann Wolfgang von Goethe"],
["Chemisches Symbol für Gold?","Au (von lat. aurum)"],
["Wie heißt der größte Planet im Sonnensystem?","Jupiter"],
["Wann fiel die Berliner Mauer?","9. November 1989"]
];
const deck=document.getElementById('deck');
cards.forEach((c,i)=>{
  const s=document.createElement('section');s.className='slot';s.style.zIndex=i+1;
  s.innerHTML=`<div class="sticky"><div class="card"><div class="flip"><div class="face front"><span class="num">KARTE ${i+1} / ${cards.length}</span><div class="q"></div><span class="hint">Tippen zum Umdrehen</span></div><div class="face backf"><span class="num">ANTWORT</span><div class="a"></div></div></div></div></div>`;
  s.querySelector('.q').textContent=c[0];s.querySelector('.a').textContent=c[1];
  const card=s.querySelector('.card');
  card.addEventListener('click',()=>card.classList.toggle('open'));
  deck.appendChild(s);
});
const slots=[...document.querySelectorAll('.slot')];
const els=slots.map(s=>s.querySelector('.card'));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ease=t=>t*t*(3-2*t);
let ticking=false;
function update(){
  const vh=window.innerHeight;
  slots.forEach((s,i)=>{
    const top=s.getBoundingClientRect().top;
    const enter=ease(clamp((vh-top)/(vh*0.75),0,1));   // langsam erscheinen
    const leave=ease(clamp(-top/(vh*0.9),0,1));        // in den Hintergrund
    const y=(1-enter)*90 - leave*40;
    const scale=(0.92+0.08*enter)*(1-0.12*leave);
    const op=enter*(1-0.85*leave);
    const el=els[i];
    el.style.opacity=op.toFixed(3);
    el.style.filter=leave>0.01?`blur(${(leave*5).toFixed(2)}px)`:'none';
    el.style.transform=`translateY(${y.toFixed(1)}px) scale(${scale.toFixed(3)})`;
  });
  ticking=false;
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(update)}},{passive:true});
addEventListener('resize',update);
update();
</script>
</body>
</html>
