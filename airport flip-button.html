<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ankünfte / Abflüge</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b0f2a;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .flip {
    perspective: 800px;
    width: min(92vw, 360px);
    height: 84px;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform .6s cubic-bezier(.4, .2, .2, 1);
    transform-style: preserve-3d;
  }
  .flip.abflug .inner { transform: rotateX(180deg); }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px;
    background: #1b2bb5;
    border-radius: 14px;
    border-left: 6px solid #29b6f6;
    color: #fff;
    font-weight: 700;
    font-size: 26px;
    text-shadow: 0 0 8px rgba(255, 255, 255, .55);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
    text-align: left;
  }
  .face.back { transform: rotateX(180deg); }
  .emoji { font-size: 34px; text-shadow: none; }
  .sub { font-weight: 400; opacity: .85; font-size: 16px; display: block; }
</style>
</head>
<body>

<button class="flip" id="flip" aria-pressed="false" aria-label="Zwischen Ankünfte und Abflüge wechseln">
  <div class="inner">
    <div class="face front">
      <span class="emoji">🛬</span>
      <span>Ankünfte<span class="sub">Arrivals</span></span>
    </div>
    <div class="face back">
      <span class="emoji">🛫</span>
      <span>Abflüge<span class="sub">Departures</span></span>
    </div>
  </div>
</button>

<script>
  const btn = document.getElementById('flip');
  // Aktueller Modus: "ankunft" oder "abflug"
  let mode = 'ankunft';

  btn.addEventListener('click', () => {
    mode = mode === 'ankunft' ? 'abflug' : 'ankunft';
    btn.classList.toggle('abflug', mode === 'abflug');
    btn.setAttribute('aria-pressed', mode === 'abflug');
    // Hier deine Anzeige umschalten, z. B. Liste neu laden:
    document.dispatchEvent(new CustomEvent('modechange', { detail: mode }));
  });

  document.addEventListener('modechange', e => console.log('Modus:', e.detail));
</script>
</body>
</html>
