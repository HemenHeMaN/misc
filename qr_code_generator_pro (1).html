<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code Generator Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ocean: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            800: '#075985',
                            900: '#0c4a6e',
                            950: '#082f49',
                        },
                        violetTheme: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            900: '#4c1d95',
                            950: '#2e1065',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- qr-code-styling Library CDN -->
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #0c1527 50%, #160d29 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-input:focus {
            background: rgba(30, 41, 59, 0.9);
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="text-slate-100 p-4 md:p-8 relative overflow-x-hidden min-h-screen flex flex-col justify-between">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-in-out flex items-center gap-3 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-2xl border border-slate-700">
        <i id="toast-icon" class="fas fa-check-circle text-emerald-400 text-xl"></i>
        <span id="toast-message" class="text-sm font-medium">Benachrichtigung</span>
    </div>

    <div class="max-w-6xl mx-auto w-full">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-gradient-to-tr from-cyan-500 to-violet-600 rounded-2xl shadow-lg shadow-cyan-500/20">
                    <i class="fas fa-qrcode text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 via-sky-200 to-violet-400 bg-clip-text text-transparent">
                        QR Studio Pro
                    </h1>
                    <p class="text-xs text-slate-400">Erstelle hochauflösende, angepasste QR-Codes</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center gap-2 text-xs text-slate-400 bg-slate-900/60 px-4 py-2 rounded-full border border-slate-800">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Vorschau aktiv
            </div>
        </header>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Controls Column (Left) -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- URL Input Box -->
                <div class="glass-panel rounded-2xl p-6 shadow-xl">
                    <label for="url-input" class="block text-sm font-semibold mb-2 text-slate-200 flex justify-between">
                        <span>Ziel-URL eingeben <span class="text-rose-400">*</span></span>
                        <span id="url-status" class="text-xs font-normal text-slate-400">Gültige URL erforderlich</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-link"></i>
                        </div>
                        <input 
                            type="text" 
                            id="url-input" 
                            placeholder="https://beispiel.de" 
                            value="https://github.com"
                            class="w-full pl-10 pr-24 py-3.5 rounded-xl glass-input text-white placeholder-slate-500 focus:outline-none transition-all text-sm"
                        >
                        <button 
                            id="btn-generate"
                            class="absolute right-2 top-2 bottom-2 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium text-xs rounded-lg shadow-md transition-all flex items-center gap-2"
                        >
                            <i class="fas fa-wand-magic-sparkles"></i> Erstellen
                        </button>
                    </div>
                    <p id="error-msg" class="mt-2 text-xs text-rose-400 hidden flex items-center gap-1">
                        <i class="fas fa-exclamation-circle"></i> Bitte eine gültige Webadresse eingeben (z.B. https://domain.de).
                    </p>
                </div>

                <!-- Customization Panel -->
    <div class="glass-panel rounded-2xl p-6 shadow-xl space-y-6">
        <h2 class="text-base font-semibold text-slate-200 border-b border-slate-800 pb-3 flex items-center justify-between">
            <span class="flex items-center gap-2"><i class="fas fa-palette text-cyan-400"></i> Design & Ecken anpassen</span>
        </h2>

        <!-- Customization Tabs -->
        <div class="flex border-b border-slate-800 gap-2 pb-2 overflow-x-auto text-xs font-medium">
            <button id="tab-corners-btn" class="tab-btn active-tab px-3 py-2 rounded-lg bg-slate-800 text-cyan-400 border border-cyan-500/30 transition-all flex items-center gap-1.5 whitespace-nowrap">
                <i class="fas fa-shapes"></i> Ecken-Design
            </button>
            <button id="tab-pattern-btn" class="tab-btn px-3 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition-all flex items-center gap-1.5 whitespace-nowrap">
                <i class="fas fa-grip-dots"></i> Muster & Farben
            </button>
            <button id="tab-logo-btn" class="tab-btn px-3 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition-all flex items-center gap-1.5 whitespace-nowrap">
                <i class="fas fa-image"></i> Logo & Einstellungen
            </button>
        </div>

        <!-- TAB 1: CORNER STYLING -->
        <div id="tab-corners" class="tab-content space-y-5">
            <!-- Corner Frame (Äußerer Ecken-Rahmen) -->
            <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800/80 space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-cyan-300 flex items-center gap-2">
                        <i class="far fa-square"></i> Äußerer Ecken-Rahmen (Corner Frame)
                    </label>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="corner-square-type" class="block text-[11px] font-medium text-slate-400 mb-1">Rahmen-Form</label>
                        <select id="corner-square-type" class="w-full glass-input text-xs rounded-xl p-2.5 text-slate-200 focus:outline-none">
                            <option value="square">Quadratisch</option>
                            <option value="extra-rounded" selected>Abgerundet (Extra)</option>
                            <option value="dot">Circle (Rund)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Rahmen-Farbe</label>
                        <div class="flex items-center gap-2 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800">
                            <input type="color" id="corner-square-color" value="#0ea5e9" class="w-7 h-7 rounded-md cursor-pointer bg-transparent border-0">
                            <span id="corner-square-color-hex" class="text-xs font-mono text-slate-300 uppercase">#0EA5E9</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Corner Ball (Innerer Ecken-Punkt) -->
            <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800/80 space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-violet-300 flex items-center gap-2">
                        <i class="fas fa-circle-dot"></i> Innerer Ecken-Punkt (Corner Ball)
                    </label>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="corner-dot-type" class="block text-[11px] font-medium text-slate-400 mb-1">Punkt-Form</label>
                        <select id="corner-dot-type" class="w-full glass-input text-xs rounded-xl p-2.5 text-slate-200 focus:outline-none">
                            <option value="square">Quadratisch</option>
                            <option value="dot" selected>Circle (Rund)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Punkt-Farbe</label>
                        <div class="flex items-center gap-2 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800">
                            <input type="color" id="corner-dot-color" value="#8b5cf6" class="w-7 h-7 rounded-md cursor-pointer bg-transparent border-0">
                            <span id="corner-dot-color-hex" class="text-xs font-mono text-slate-300 uppercase">#8B5CF6</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: PATTERN & COLORS -->
        <div id="tab-pattern" class="tab-content hidden space-y-5">
            <!-- Dots / Körper Stil -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="dots-style" class="block text-xs font-medium text-slate-300 mb-2">Muster-Stil (Körper)</label>
                    <select id="dots-style" class="w-full glass-input text-xs rounded-xl p-3 text-slate-200 focus:outline-none">
                        <option value="square">Quadratisch (Klassisch)</option>
                        <option value="dots">Punkte</option>
                        <option value="rounded" selected>Abgerundet</option>
                        <option value="classy">Classy</option>
                        <option value="classy-rounded">Classy Rounded</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-2">Muster-Farbe</label>
                    <div class="flex items-center gap-3 bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                        <input type="color" id="fg-color" value="#0f172a" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0">
                        <span id="fg-color-hex" class="text-xs font-mono text-slate-300 uppercase">#0F172A</span>
                    </div>
                </div>
            </div>

            <!-- Background Color -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-2">Hintergrundfarbe</label>
                <div class="flex items-center gap-3 bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                    <input type="color" id="bg-color" value="#ffffff" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0">
                    <span id="bg-color-hex" class="text-xs font-mono text-slate-300 uppercase">#FFFFFF</span>
                </div>
            </div>
        </div>

        <!-- TAB 3: LOGO & SETTINGS -->
        <div id="tab-logo" class="tab-content hidden space-y-5">
            <!-- Logo Auswahl -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-2">Zentrales Logo</label>
                <div class="flex flex-wrap items-center gap-2.5">
                    <button data-logo="" class="preset-logo-btn p-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-cyan-500 text-xs text-slate-300 transition-all flex items-center gap-1">
                        Kein Logo
                    </button>
                    <button data-logo="https://cdn-icons-png.flaticon.com/512/25/25231.png" class="preset-logo-btn p-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-xs text-slate-300 transition-all flex items-center gap-1">
                        <i class="fab fa-github"></i> GitHub
                    </button>
                    <button data-logo="https://cdn-icons-png.flaticon.com/512/174/174857.png" class="preset-logo-btn p-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-xs text-slate-300 transition-all flex items-center gap-1">
                        <i class="fab fa-linkedin"></i> LinkedIn
                    </button>
                    <button data-logo="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" class="preset-logo-btn p-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-xs text-slate-300 transition-all flex items-center gap-1">
                        <i class="fab fa-youtube text-red-500"></i> YouTube
                    </button>
                    
                    <label class="cursor-pointer p-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-xs text-slate-300 transition-all flex items-center gap-1">
                        <i class="fas fa-upload text-cyan-400"></i> Hochladen
                        <input type="file" id="logo-file" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Logo Size & Margin Sliders -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="logo-size" class="text-xs font-medium text-slate-300">Logo-Größe</label>
                        <span id="logo-size-val" class="text-[11px] font-mono text-cyan-400">0.3</span>
                    </div>
                    <input type="range" id="logo-size" min="0.1" max="0.5" step="0.05" value="0.3" class="w-full accent-cyan-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="logo-margin" class="text-xs font-medium text-slate-300">Logo-Abstand</label>
                        <span id="logo-margin-val" class="text-[11px] font-mono text-cyan-400">5px</span>
                    </div>
                    <input type="range" id="logo-margin" min="0" max="20" step="1" value="5" class="w-full accent-cyan-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
                </div>
            </div>

            <!-- Resolution -->
            <div>
                <label for="qr-size" class="block text-xs font-medium text-slate-300 mb-2">Export-Auflösung</label>
                <select id="qr-size" class="w-full glass-input text-xs rounded-xl p-3 text-slate-200 focus:outline-none">
                    <option value="400" selected>Mittel (400 x 400 px)</option>
                    <option value="800">Groß (800 x 800 px)</option>
                    <option value="1200">HD Druck (1200 x 1200 px)</option>
                    <option value="2000">Ultra-HD (2000 x 2000 px)</option>
                </select>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State
            let logoUrl = '';
            let history = JSON.parse(localStorage.getItem('qr_history') || '[]');

            // DOM Elements
            const urlInput = document.getElementById('url-input');
            const errorMsg = document.getElementById('error-msg');
            const urlStatus = document.getElementById('url-status');
            
            // Colors & Pattern
            const fgColorInput = document.getElementById('fg-color');
            const bgColorInput = document.getElementById('bg-color');
            const fgColorHex = document.getElementById('fg-color-hex');
            const bgColorHex = document.getElementById('bg-color-hex');
            const dotsStyleSelect = document.getElementById('dots-style');

            // Corner Styling Controls
            const cornerSquareTypeSelect = document.getElementById('corner-square-type');
            const cornerSquareColorInput = document.getElementById('corner-square-color');
            const cornerSquareColorHex = document.getElementById('corner-square-color-hex');

            const cornerDotTypeSelect = document.getElementById('corner-dot-type');
            const cornerDotColorInput = document.getElementById('corner-dot-color');
            const cornerDotColorHex = document.getElementById('corner-dot-color-hex');

            // Logo & Size
            const logoSizeInput = document.getElementById('logo-size');
            const logoSizeVal = document.getElementById('logo-size-val');
            const logoMarginInput = document.getElementById('logo-margin');
            const logoMarginVal = document.getElementById('logo-margin-val');
            const qrSizeSelect = document.getElementById('qr-size');
            const logoFileInput = document.getElementById('logo-file');
            const presetLogoBtns = document.querySelectorAll('.preset-logo-btn');
            
            const qrContainer = document.getElementById('qrcode-container');
            const btnGenerate = document.getElementById('btn-generate');
            const btnDownloadPng = document.getElementById('btn-download-png');
            const btnDownloadSvg = document.getElementById('btn-download-svg');
            const btnCopy = document.getElementById('btn-copy');
            const btnClearHistory = document.getElementById('btn-clear-history');
            const historyList = document.getElementById('history-list');

            // Tab Navigation Logic
            const tabs = [
                { btn: document.getElementById('tab-corners-btn'), content: document.getElementById('tab-corners') },
                { btn: document.getElementById('tab-pattern-btn'), content: document.getElementById('tab-pattern') },
                { btn: document.getElementById('tab-logo-btn'), content: document.getElementById('tab-logo') }
            ];

            tabs.forEach(({ btn, content }) => {
                btn.addEventListener('click', () => {
                    tabs.forEach(t => {
                        t.btn.classList.remove('bg-slate-800', 'text-cyan-400', 'border', 'border-cyan-500/30');
                        t.btn.classList.add('text-slate-400');
                        t.content.classList.add('hidden');
                    });
                    btn.classList.add('bg-slate-800', 'text-cyan-400', 'border', 'border-cyan-500/30');
                    btn.classList.remove('text-slate-400');
                    content.classList.remove('hidden');
                });
            });

            // Initialize QRCodeStyling Instance
            const qrCode = new QRCodeStyling({
                width: 240,
                height: 240,
                type: 'svg',
                data: urlInput.value,
                image: '',
                dotsOptions: {
                    color: fgColorInput.value,
                    type: dotsStyleSelect.value
                },
                cornersSquareOptions: {
                    type: cornerSquareTypeSelect.value,
                    color: cornerSquareColorInput.value
                },
                cornersDotOptions: {
                    type: cornerDotTypeSelect.value,
                    color: cornerDotColorInput.value
                },
                backgroundOptions: {
                    color: bgColorInput.value,
                },
                imageOptions: {
                    crossOrigin: 'anonymous',
                    margin: parseInt(logoMarginInput.value, 10),
                    imageSize: parseFloat(logoSizeInput.value)
                }
            });

            // Append Canvas
            qrContainer.innerHTML = '';
            qrCode.append(qrContainer);

            // Toast System
            function showToast(message, isError = false) {
                const toast = document.getElementById('toast');
                const toastMessage = document.getElementById('toast-message');
                const toastIcon = document.getElementById('toast-icon');

                toastMessage.textContent = message;
                if (isError) {
                    toastIcon.className = 'fas fa-exclamation-circle text-rose-400 text-xl';
                } else {
                    toastIcon.className = 'fas fa-check-circle text-emerald-400 text-xl';
                }

                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }

            // URL Validation helper
            function isValidUrl(string) {
                try {
                    const url = new URL(string.startsWith('http://') || string.startsWith('https://') ? string : `https://${string}`);
                    return url.hostname.includes('.');
                } catch (_) {
                    return false;
                }
            }

            function getFormattedUrl(val) {
                if (!val) return '';
                if (!/^https?:\/\//i.test(val)) {
                    return 'https://' + val;
                }
                return val;
            }

            // Update QR Code
            function updateQRCode(saveToHistoryFlag = false) {
                const rawVal = urlInput.value.trim();
                
                if (!rawVal || !isValidUrl(rawVal)) {
                    errorMsg.classList.remove('hidden');
                    urlStatus.textContent = 'Ungültige URL';
                    urlStatus.className = 'text-xs font-normal text-rose-400';
                    return false;
                } else {
                    errorMsg.classList.add('hidden');
                    urlStatus.textContent = 'Gültige URL';
                    urlStatus.className = 'text-xs font-normal text-emerald-400';
                }

                const finalUrl = getFormattedUrl(rawVal);

                qrCode.update({
                    data: finalUrl,
                    dotsOptions: {
                        color: fgColorInput.value,
                        type: dotsStyleSelect.value
                    },
                    cornersSquareOptions: {
                        type: cornerSquareTypeSelect.value,
                        color: cornerSquareColorInput.value
                    },
                    cornersDotOptions: {
                        type: cornerDotTypeSelect.value,
                        color: cornerDotColorInput.value
                    },
                    backgroundOptions: {
                        color: bgColorInput.value
                    },
                    image: logoUrl,
                    imageOptions: {
                        crossOrigin: 'anonymous',
                        margin: parseInt(logoMarginInput.value, 10),
                        imageSize: parseFloat(logoSizeInput.value)
                    }
                });

                if (saveToHistoryFlag) {
                    addToHistory(finalUrl);
                }

                return true;
            }

            // Event Listeners for Live Update
            urlInput.addEventListener('input', () => updateQRCode(false));
            
            fgColorInput.addEventListener('input', (e) => {
                fgColorHex.textContent = e.target.value.toUpperCase();
                updateQRCode(false);
            });

            bgColorInput.addEventListener('input', (e) => {
                bgColorHex.textContent = e.target.value.toUpperCase();
                updateQRCode(false);
            });

            // Corner Square & Dot Event Listeners
            cornerSquareTypeSelect.addEventListener('change', () => updateQRCode(false));
            cornerSquareColorInput.addEventListener('input', (e) => {
                cornerSquareColorHex.textContent = e.target.value.toUpperCase();
                updateQRCode(false);
            });

            cornerDotTypeSelect.addEventListener('change', () => updateQRCode(false));
            cornerDotColorInput.addEventListener('input', (e) => {
                cornerDotColorHex.textContent = e.target.value.toUpperCase();
                updateQRCode(false);
            });

            dotsStyleSelect.addEventListener('change', () => updateQRCode(false));

            logoSizeInput.addEventListener('input', (e) => {
                logoSizeVal.textContent = e.target.value;
                updateQRCode(false);
            });

            logoMarginInput.addEventListener('input', (e) => {
                logoMarginVal.textContent = `${e.target.value}px`;
                updateQRCode(false);
            });

            btnGenerate.addEventListener('click', () => {
                if (updateQRCode(true)) {
                    showToast('QR-Code erfolgreich generiert!');
                }
            });

            // Preset Logos
            presetLogoBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    presetLogoBtns.forEach(b => b.classList.replace('border-cyan-500', 'border-slate-700'));
                    btn.classList.replace('border-slate-700', 'border-cyan-500');
                    logoUrl = btn.getAttribute('data-logo');
                    logoFileInput.value = '';
                    updateQRCode(false);
                });
            });

            // Custom Logo Upload
            logoFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 2 * 1024 * 1024) {
                        showToast('Logo darf maximal 2MB groß sein.', true);
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        logoUrl = event.target.result;
                        presetLogoBtns.forEach(b => b.classList.replace('border-cyan-500', 'border-slate-700'));
                        updateQRCode(false);
                        showToast('Eigenes Logo hochgeladen');
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Download Handlers
            btnDownloadPng.addEventListener('click', () => {
                if (!updateQRCode(true)) return;
                const size = parseInt(qrSizeSelect.value, 10);
                qrCode.download({
                    name: 'qr-code-custom',
                    extension: 'png',
                    width: size,
                    height: size
                });
                showToast('PNG Download gestartet');
            });

            btnDownloadSvg.addEventListener('click', () => {
                if (!updateQRCode(true)) return;
                const size = parseInt(qrSizeSelect.value, 10);
                qrCode.download({
                    name: 'qr-code-custom',
                    extension: 'svg',
                    width: size,
                    height: size
                });
                showToast('SVG Download gestartet');
            });

            // Copy to Clipboard (as Image)
            btnCopy.addEventListener('click', async () => {
                if (!updateQRCode(true)) return;
                
                try {
                    const rawVal = getFormattedUrl(urlInput.value.trim());
                    const tempQr = new QRCodeStyling({
                        width: 400,
                        height: 400,
                        type: 'canvas',
                        data: rawVal,
                        image: logoUrl,
                        dotsOptions: { color: fgColorInput.value, type: dotsStyleSelect.value },
                        cornersSquareOptions: { type: cornerSquareTypeSelect.value, color: cornerSquareColorInput.value },
                        cornersDotOptions: { type: cornerDotTypeSelect.value, color: cornerDotColorInput.value },
                        backgroundOptions: { color: bgColorInput.value },
                        imageOptions: { crossOrigin: 'anonymous', margin: parseInt(logoMarginInput.value, 10), imageSize: parseFloat(logoSizeInput.value) }
                    });

                    const blob = await tempQr.getRawData('png');
                    if (blob) {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        showToast('QR-Code Bild in die Zwischenablage kopiert!');
                    } else {
                        showToast('Fehler beim Kopieren.', true);
                    }
                } catch (err) {
                    showToast('Zwischenablage wird vom Browser nicht unterstützt.', true);
                }
            });

            // History Functions
            function addToHistory(url) {
                history = history.filter(item => item.url !== url);
                history.unshift({
                    url: url,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                if (history.length > 10) history.pop();
                localStorage.setItem('qr_history', JSON.stringify(history));
                renderHistory();
            }

            function renderHistory() {
                if (history.length === 0) {
                    historyList.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Noch keine QR-Codes generiert</p>';
                    return;
                }

                historyList.innerHTML = history.map((item) => `
                    <div class="flex items-center justify-between p-2.5 bg-slate-900/40 hover:bg-slate-900/80 rounded-xl border border-slate-800/60 transition-all text-xs group">
                        <div class="truncate max-w-[180px] sm:max-w-[240px] cursor-pointer history-item-click" data-url="${item.url}">
                            <div class="font-medium text-slate-300 truncate group-hover:text-cyan-400 transition-colors">${item.url}</div>
                            <div class="text-[10px] text-slate-500">${item.date}</div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button class="p-1.5 text-slate-400 hover:text-white history-item-click" data-url="${item.url}" title="Laden">
                                <i class="fas fa-arrow-up-right-from-square"></i>
                            </button>
                        </div>
                    </div>
                `).join('');

                document.querySelectorAll('.history-item-click').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const targetUrl = e.currentTarget.getAttribute('data-url');
                        urlInput.value = targetUrl;
                        updateQRCode(false);
                        showToast('URL aus Historie geladen');
                    });
                });
            }

            btnClearHistory.addEventListener('click', () => {
                history = [];
                localStorage.removeItem('qr_history');
                renderHistory();
                showToast('Historie geleert');
            });

            // Initial Execution
            renderHistory();
            updateQRCode(false);
        });
    </script>
</body>
</html>
