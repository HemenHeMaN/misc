<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taxi-Dachzeichen-Schalter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Barlow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --bg: #e6e9ef;
    --ink: #1a2130;
    --muted: #5d687c;
    --card: #f7f8fa;
    --line: #c5ccd8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1020; --ink: #eef0f7; --muted: #8e99b8; --card: #151b31; --line: #2a3354;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1020; --ink: #eef0f7; --muted: #8e99b8; --card: #151b31; --line: #2a3354;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 1.4rem;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    transition: background .6s ease, color .6s ease;
  }
  /* Beim Laden keine Animation, damit der gespeicherte Zustand sofort steht */
  .no-anim, .no-anim *, .no-anim *::before, .no-anim *::after { transition: none !important; }
  .no-anim .lit, .no-anim .glow { animation: none !important; }

  /* =========================================================
     Taxi-Dachzeichen-Schalter
     Größe ändern: einfach font-size von .tx anpassen (1em = Basis)
     ========================================================= */
  .tx {
    position: relative;
    display: inline-block;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    border-radius: 6em;
    -webkit-tap-highlight-color: transparent;
  }
  .tx input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 4;
  }

  .track {
    position: relative;
    display: block;
    width: 15.625em;
    height: 5.75em;
    border: .125em solid rgba(26, 33, 48, .18);
    border-radius: 6em;
    overflow: hidden;
    background: linear-gradient(180deg, #cfe2f4, #f2f7fc);
    box-shadow: inset 0 .25em .6em rgba(20, 30, 50, .18), 0 .35em 1em rgba(20, 30, 50, .16);
    transition: border-color .6s ease;
  }
  .track::before {                      /* Nachthimmel */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #060919, #1b2250);
    opacity: 0;
    transition: opacity .6s ease;
  }
  .tx input:checked + .track { border-color: rgba(255, 255, 255, .14); }
  .tx input:checked + .track::before { opacity: 1; }
  .tx input:focus-visible + .track { outline: .2em solid #ffb800; outline-offset: .25em; }

  /* Beschriftung auf der freien Seite */
  .t {
    position: absolute;
    z-index: 1;
    top: 50%;
    transform: translateY(-50%);
    font: 600 1.15em/1 var(--font);
    letter-spacing: .02em;
    transition: opacity .4s ease;
  }
  .t-night { right: 1.5em; color: #52627c; }
  .t-day   { left: 1.6em;  color: #93a3d2; opacity: 0; }
  .tx input:checked + .track .t-night { opacity: 0; }
  .tx input:checked + .track .t-day   { opacity: 1; }

  /* Sterne (nur nachts) */
  .stars {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .tx input:checked + .track .stars { opacity: 1; transition: opacity .6s ease .25s; }
  .stars i {
    position: absolute;
    display: block;
    width: var(--s);
    height: var(--s);
    background: #fff;
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
    animation: twinkle 2.6s ease-in-out var(--d) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .35; transform: scale(.7); }
  }

  /* Knopf = das Dachzeichen */
  .knob {
    position: absolute;
    z-index: 2;
    top: .75em;
    left: .75em;
    width: 7.5em;
    height: 4em;
    transition: transform .75s cubic-bezier(.6, -.15, .25, 1.15);
  }
  .tx input:checked + .track .knob { transform: translateX(6.375em); }

  /* Lichtschein */
  .glow {
    position: absolute;
    z-index: 0;
    inset: -2.6em -3em;
    background: radial-gradient(closest-side, rgba(255, 206, 72, .7), rgba(255, 206, 72, 0));
    opacity: 0;
    transform: scale(.5);
    pointer-events: none;
    transition: opacity .3s ease, transform .4s ease;
  }
  .tx input:checked + .track .glow {
    opacity: 1;
    transform: none;
    transition: opacity .5s ease .3s, transform .6s ease .3s;
    animation: ignite .9s ease .55s both;
  }

  .sign {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    transition: filter .3s ease;
  }
  .tx input:checked + .track .sign {
    filter: drop-shadow(0 0 .45em rgba(255, 214, 90, .85));
    transition: filter .5s ease .5s;
  }
  .bar, .foot { fill: #454b5c; }
  .gloss { fill: #fff; opacity: .35; }
  .lit { opacity: 0; transition: opacity .25s ease; }
  .tx input:checked + .track .lit { opacity: 1; animation: ignite .9s ease .55s both; }
  .txt {
    fill: #4b4a42;
    font-family: var(--font);
    font-weight: 800;
    font-size: 26px;
    transition: fill .3s ease;
  }
  .tx input:checked + .track .txt { fill: #17130a; transition: fill .3s ease .55s; }

  /* Zeichen flackert kurz beim Einschalten */
  @keyframes ignite {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    20%  { opacity: .15; }
    34%  { opacity: 1; }
    44%  { opacity: .4; }
    58%, 100% { opacity: 1; }
  }

  /* ---------- Demo-Umgebung (nur zur Ansicht) ---------- */
  .cap { text-align: center; }
  .cap strong { display: block; font-size: 1.5rem; font-weight: 700; }
  .cap span { color: var(--muted); font-size: 1rem; }

  .card {
    width: 100%;
    max-width: 26rem;
    padding: 1.1rem 1.2rem 1.2rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: .9rem;
    transition: background .6s ease, border-color .6s ease;
  }
  .card .meta { margin: 0 0 .35rem; color: var(--muted); font-size: .95rem; }
  .card h2 { margin: 0 0 .9rem; font-size: 1.35rem; line-height: 1.25; font-weight: 700; }
  .opt {
    display: flex;
    align-items: center;
    gap: .7rem;
    padding: .7rem .8rem;
    margin-top: .5rem;
    border: 1px solid var(--line);
    border-radius: .6rem;
    font-size: 1.05rem;
    cursor: pointer;
  }
  .opt input { accent-color: #f2b705; width: 1.1rem; height: 1.1rem; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body class="no-anim">

  <label class="tx">
    <input type="checkbox" id="tx" role="switch" aria-label="Nachtmodus mit eingeschaltetem Taxi-Dachzeichen">
    <span class="track">

      <span class="stars" aria-hidden="true">
        <i style="left:1.0em; top:1.0em; --s:.55em; --d:0s"></i>
        <i style="left:4.6em; top:.9em;  --s:.4em;  --d:.7s"></i>
        <i style="left:6.4em; top:1.9em; --s:.35em; --d:1.3s"></i>
        <i style="left:.9em;  top:4.2em; --s:.35em; --d:.4s"></i>
        <i style="left:3.9em; top:4.4em; --s:.3em;  --d:1.8s"></i>
        <i style="left:6.0em; top:4.1em; --s:.45em; --d:1.0s"></i>
      </span>

      <span class="t t-night" aria-hidden="true">Nacht</span>
      <span class="t t-day" aria-hidden="true">Tag</span>

      <span class="knob">
        <span class="glow"></span>
        <svg class="sign" viewBox="0 0 120 64" aria-hidden="true">
          <defs>
            <linearGradient id="offgrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e4e0cd"/>
              <stop offset="1" stop-color="#c6c2ac"/>
            </linearGradient>
            <radialGradient id="litgrad" cx=".5" cy=".4" r=".75">
              <stop offset="0" stop-color="#fffdf0"/>
              <stop offset=".55" stop-color="#fff0a6"/>
              <stop offset="1" stop-color="#ffd24d"/>
            </radialGradient>
          </defs>
          <rect class="bar"  x="16" y="46" width="88" height="8" rx="3"/>
          <rect class="foot" x="22" y="52" width="18" height="10" rx="2.5"/>
          <rect class="foot" x="80" y="52" width="18" height="10" rx="2.5"/>
          <rect x="4" y="6" width="112" height="44" rx="16" fill="url(#offgrad)" stroke="rgba(0,0,0,.2)" stroke-width="1"/>
          <rect class="lit" x="4" y="6" width="112" height="44" rx="16" fill="url(#litgrad)"/>
          <rect class="gloss" x="14" y="10" width="92" height="9" rx="4.5"/>
          <text class="txt" x="60" y="37" text-anchor="middle" textLength="78" lengthAdjust="spacingAndGlyphs">TAXI</text>
        </svg>
      </span>

    </span>
  </label>

  <div class="cap" aria-live="polite">
    <strong id="mode">Tagmodus</strong>
    <span id="sub">Dachzeichen aus</span>
  </div>



<script>
  (function () {
    var KEY = 'taxi-quiz-theme';
    var root = document.documentElement;
    var cb = document.getElementById('tx');
    var mode = document.getElementById('mode');
    var sub = document.getElementById('sub');

    function apply() {
      var night = cb.checked;
      root.setAttribute('data-theme', night ? 'dark' : 'light');
      mode.textContent = night ? 'Nachtmodus' : 'Tagmodus';
      sub.textContent = night ? 'Dachzeichen an' : 'Dachzeichen aus';
    }

    // gespeicherte Wahl nutzen, sonst Systemeinstellung
    var night = false, saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved === 'dark' || saved === 'light') {
      night = saved === 'dark';
    } else {
      try { night = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    }
    cb.checked = night;
    apply();

    cb.addEventListener('change', function () {
      apply();
      try { localStorage.setItem(KEY, cb.checked ? 'dark' : 'light'); } catch (e) {}
    });

    // Übergänge erst nach dem ersten Rendern erlauben
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { document.body.classList.remove('no-anim'); });
    });
  })();
</script>
</body>
</html>
